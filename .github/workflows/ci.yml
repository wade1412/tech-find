name: Quality Gate

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # -----------------------------
      # Repository
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -----------------------------
      # Frontend
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      # -----------------------------
      # Supabase
      # -----------------------------
      - name: Start local supabase
        id: supabase_start
        run: npx supabase start

      - name: Lint database
        run: npx supabase db lint --level warning --fail-on error

      - name: Run SQL integration tests
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          test_files=(supabase/tests/*_integration_test.sql)

          if (( ${#test_files[@]} == 0 )); then
            echo "No SQL integration tests found."
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            echo "Running ${test_file}"

            docker exec -i supabase_db_tech-find \
              psql \
                -v ON_ERROR_STOP=1 \
                -U postgres \
                -d postgres \
              < "${test_file}"
          done

      - name: Stop local Supabase
        if: ${{ always() && steps.supabase_start.outcome != 'skipped' }}
        continue-on-error: true
        run: npx supabase stop --no-backup
